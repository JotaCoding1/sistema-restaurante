<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caixa · à mesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600\&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/shared/styles/base.css" />
  <!-- módulos usados nesta página -->
  <link rel="stylesheet" href="app/modules/payments/payments.css" />
  <!-- composição da página -->
  <link rel="stylesheet" href="app/pages/caixa.css" />
</head>
<body>
  <main class="page">
    <header id="hero"></header>

    <div class="cashier-layout">
      <section class="bills" aria-labelledby="billsTitle">
        <div class="section-head">
          <h2 class="section-title" id="billsTitle">Mesas ocupadas <small id="billsCount"></small></h2>
          <span id="billsIcon"></span>
        </div>
        <ul class="bill-list" id="billList"></ul>
      </section>

      <section class="bill" id="billPanel" aria-live="polite"></section>
    </div>
  </main>

  <script type="module" src="app/pages/caixa.page.js"></script>
</body>
</html>
